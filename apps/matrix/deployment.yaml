---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-synapse
  namespace: matrix
  labels:
    app: matrix-synapse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matrix-synapse
  template:
    metadata:
      labels:
        app: matrix-synapse
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 991
        fsGroup: 991
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      initContainers:
      - name: generate-config
        image: matrixdotorg/synapse:latest
        command: 
        - /bin/sh
        - -c
        - |
          if [ ! -f /data/homeserver.yaml ]; then
            /start.py generate
            cat > /data/homeserver.yaml <<'EOF'
          server_name: "commune.gluk0.sh"
          public_baseurl: "https://commune.gluk0.sh"
          
          listeners:
            - port: 8008
              type: http
              tls: false
              bind_addresses: ['0.0.0.0']
              x_forwarded: true
              resources:
                - names: [client, federation]
                  compress: false
          
          database:
            name: sqlite3
            args:
              database: /data/homeserver.db
          
          log_config: "/data/commune.gluk0.sh.log.config"
          media_store_path: /data/media_store
          
          enable_registration: true
          enable_registration_without_verification: false
          
          suppress_key_server_warning: true
          
          trusted_key_servers:
            - server_name: "matrix.org"
          EOF
          fi
        volumeMounts:
        - name: data
          mountPath: /data
        securityContext:
          runAsUser: 991
          allowPrivilegeEscalation: false
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: matrix-data
      - name: tmp
        emptyDir: {}
      containers:
      - name: synapse
        image: matrixdotorg/synapse:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8008
          name: http
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: 8008
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8008
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        securityContext:
          runAsNonRoot: true
          runAsUser: 991
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
