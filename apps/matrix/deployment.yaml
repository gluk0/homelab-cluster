---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-synapse
  namespace: matrix
  labels:
    app: matrix-synapse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matrix-synapse
  template:
    metadata:
      labels:
        app: matrix-synapse
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 991
        fsGroup: 991
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      initContainers:
      - name: generate-config
        image: matrixdotorg/synapse:latest
        env:
        - name: SYNAPSE_SERVER_NAME
          value: "commune.gluk0.sh"
        - name: SYNAPSE_REPORT_STATS
          value: "no"
        - name: SYNAPSE_CONFIG_DIR
          value: "/data"
        - name: SYNAPSE_CONFIG_PATH
          value: "/data/homeserver.yaml"
        - name: SYNAPSE_DATA_DIR
          value: "/data"
        command: 
        - /bin/sh
        - -c
        - |
          if [ ! -f /data/homeserver.yaml ]; then
            echo "Generating initial config..."
            /start.py generate
            echo "Updating config with report_stats..."
            sed -i 's/# report_stats:.*/report_stats: false/' /data/homeserver.yaml
            echo "Config generated successfully"
          else
            echo "Config already exists, skipping generation"
          fi
          fi
        volumeMounts:
        - name: data
          mountPath: /data
        securityContext:
          runAsUser: 991
          allowPrivilegeEscalation: false
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: matrix-data
      - name: tmp
        emptyDir: {}
      containers:
      - name: synapse
        image: matrixdotorg/synapse:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8008
          name: http
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: 8008
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8008
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        securityContext:
          runAsNonRoot: true
          runAsUser: 991
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
